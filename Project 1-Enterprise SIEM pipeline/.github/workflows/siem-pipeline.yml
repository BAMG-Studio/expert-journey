name: Enterprise SIEM Pipeline CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'Project 1-Enterprise SIEM pipeline/**'
  pull_request:
    branches: [main]
    paths:
      - 'Project 1-Enterprise SIEM pipeline/**'

env:
  TF_VERSION: '1.6.0'
  AWS_REGION: 'us-east-1'

jobs:
  # Terraform Lint and Validate
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Project 1-Enterprise SIEM pipeline/terraform'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true
      
      - name: Terraform Init
        run: terraform init -backend=false
      
      - name: Terraform Validate
        run: terraform validate

  # Python Lambda Lint
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linters
        run: pip install flake8 black
      
      - name: Run flake8
        run: flake8 'Project 1-Enterprise SIEM pipeline/lambda/' --max-line-length=120
        continue-on-error: true

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: 'Project 1-Enterprise SIEM pipeline/terraform'
          framework: terraform
          soft_fail: true

  # LocalStack Integration Test
  localstack-test:
    name: LocalStack Integration Test
    runs-on: ubuntu-latest
    needs: [terraform-validate, python-lint]
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3,kinesis,firehose,lambda,iam,kms
    defaults:
      run:
        working-directory: 'Project 1-Enterprise SIEM pipeline/terraform'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Wait for LocalStack
        run: sleep 30
      
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Plan (LocalStack)
        run: terraform plan -var-file=environments/localstack.tfvars
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
